name: Daily original manga
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-manga
  cancel-in-progress: false
jobs:
  create-episode:
    if: vars.DAILY_MANGA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate one original illustrated episode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/daily-manga.mjs
      - name: Publish completed episode
        run: |
          git config user.name "Yorumi Manga Studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/manga
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish daily original manga"
          git push origin HEAD:main
